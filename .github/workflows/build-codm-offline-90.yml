name: Build CODM Offline 90 APK
on:
  push:
    branches: [codm-offline-90-no-vip-20261015]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        working-directory: offline-codm
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK manifest and permissions
        run: |
          set -euo pipefail
          APK="offline-codm/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$AAPT" dump badging "$APK" > /tmp/codm_badging.txt
          "$AAPT" dump permissions "$APK" > /tmp/codm_permissions.txt
          grep -F "name='com.codm.gamehost.offline'" /tmp/codm_badging.txt
          grep -F "com.codm.gamehost.offline.MainActivity" /tmp/codm_badging.txt
          grep -F "moe.shizuku.manager.permission.API_V23" /tmp/codm_permissions.txt
          if grep -q "android.permission.INTERNET" /tmp/codm_permissions.txt; then
            echo "ERROR: Unexpected Internet permission"
            exit 1
          fi
          if grep -q "android.permission.POST_NOTIFICATIONS" /tmp/codm_permissions.txt; then
            echo "ERROR: Unexpected notification permission"
            exit 1
          fi
          echo "PASS: package, launcher, Shizuku, offline-only permissions"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-OFFLINE-90-V2-1-APK
          path: offline-codm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp offline-codm/app/build/outputs/apk/debug/app-debug.apk CODM_OFFLINE_90_v2_1.apk
          if gh release view codm-offline90-v2.1 >/dev/null 2>&1; then
            gh release upload codm-offline90-v2.1 CODM_OFFLINE_90_v2_1.apk --clobber
          else
            gh release create codm-offline90-v2.1 CODM_OFFLINE_90_v2_1.apk \
              --target "$GITHUB_SHA" \
              --title "CODM Offline 90 v2.1 - Canonical Package ID" \
              --notes "Canonical applicationId com.codm.gamehost.offline; standalone Android dashboard without ads or VIP for CODM GameManager profile (90 FPS / 0.7 / Performance), verification and game launching. NOT a patched Radiant Tools APK. Root is not required; Shizuku is required. Actual FPS is not guaranteed."
          fi
