name: Build CODM Offline 90 APK
on:
  push:
    branches: [codm-offline-90-no-vip-20261015]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble APK
        working-directory: offline-codm
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CODM-NOVA-90-V2-APK
          path: offline-codm/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp offline-codm/app/build/outputs/apk/debug/app-debug.apk CODM_NOVA_90_v2.apk
          if gh release view codm-nova90-v2.0 >/dev/null 2>&1; then
            gh release upload codm-nova90-v2.0 CODM_NOVA_90_v2.apk --clobber
          else
            gh release create codm-nova90-v2.0 CODM_NOVA_90_v2.apk \
              --target "$GITHUB_SHA" \
              --title "CODM NOVA 90 v2 - Standalone Shizuku Performance Lab" \
              --notes "Standalone redesigned native Android dashboard without ads or VIP for CODM GameManager profile (90 FPS / 0.7 / Performance), verification and game launching. NOT a patched Radiant Tools APK. Root is not required; Shizuku is required. Actual FPS is not guaranteed."
          fi
