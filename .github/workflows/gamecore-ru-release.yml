name: GameCore RU Release
on:
  push:
    branches: [gamecore-ru-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout localization workflow
        uses: actions/checkout@v4

      - name: Checkout GameCore 3.18.0 sources
        uses: actions/checkout@v4
        with:
          repository: Dreamucxe/GameCore
          ref: 7a11384e28907cb46b7f833c3b07dc0b01d18a7c
          path: GameCore
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android 34 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install translation engine
        run: python3 -m pip install --break-system-packages argostranslate

      - name: Translate Kotlin and bundled plugin interfaces
        run: python3 .gamecore-ru/localize.py GameCore

      - name: Prepare release signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt -keystore "$GITHUB_WORKSPACE/gamecore-ru-release.jks" -alias gamecore-ru -keyalg RSA -keysize 3072 -validity 3650 -storepass 'gamecore-ru-build' -keypass 'gamecore-ru-build' -dname "CN=GameCore RU, OU=Localization, O=GameCore Community, C=UA"
          cat > GameCore/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/gamecore-ru-release.jks
          storePassword=gamecore-ru-build
          keyAlias=gamecore-ru
          keyPassword=gamecore-ru-build
          EOF

      - name: Build minified Release APK
        working-directory: GameCore
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Validate signing and copy APK
        shell: bash
        run: |
          set -euo pipefail
          APK="GameCore/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/game_core_ru.apk"
          sha256sum "$GITHUB_WORKSPACE/game_core_ru.apk"

      - name: Publish APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game_core_ru-release
          path: game_core_ru.apk
          if-no-files-found: error
          retention-days: 30
