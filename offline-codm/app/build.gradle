plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codm.gamehost.offline'
    compileSdk 35

    defaultConfig {
        applicationId 'com.codm.gamehost.nova'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '2.0'
    }
    buildFeatures {
        aidl true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
